services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: migration-validator:php8.4
    ports:
      - "8080:80"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    restart: unless-stopped

volumes:
  vendor:
